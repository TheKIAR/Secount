name: Secount CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/**"
      - "!assets/**"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secount-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shared tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run shared tests
        shell: pwsh
        run: gradle -p android :shared:desktopTest --no-daemon

  build:
    name: Build all release artifacts
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build desktop JAR, Windows EXE and Android release APK
        shell: pwsh
        run: |
          gradle -p android :desktopApp:packageUberJarForCurrentOS :desktopApp:packageExe :androidApp:assembleRelease --no-daemon
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $jar = Get-ChildItem android/desktopApp/build/compose/jars/*.jar | Select-Object -First 1
          Copy-Item $jar.FullName "dist/Secount-${{ github.sha }}.jar"
          $exe = Get-ChildItem "android/desktopApp/build/compose/binaries/main/exe/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows EXE was not produced" }
          Copy-Item $exe.FullName "dist/Secount-${{ github.sha }}-windows.exe"
          $apk = Get-ChildItem "android/androidApp/build/outputs/apk/release/androidApp-release*.apk" | Select-Object -First 1
          if (-not $apk) { throw "Android release APK was not produced" }
          # No keystore in CI: label unsigned output honestly so it is never mistaken for a signed production APK.
          $apkSuffix = if ($apk.Name -like "*unsigned*") { "-android-unsigned.apk" } else { "-android.apk" }
          Copy-Item $apk.FullName ("dist/Secount-${{ github.sha }}" + $apkSuffix)
          Get-ChildItem dist | ForEach-Object { if ($_.Length -lt 1024) { throw "Artifact looks invalid: $($_.Name)" } }
          Get-FileHash dist/* -Algorithm SHA256 | Format-Table
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secount-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
