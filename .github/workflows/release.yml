name: Release Secount

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test
        shell: pwsh
        run: gradle -p android :shared:desktopTest --no-daemon
      - name: Build release artifacts
        shell: pwsh
        run: |
          gradle -p android :desktopApp:packageUberJarForCurrentOS :desktopApp:packageExe :androidApp:assembleRelease --no-daemon
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $jar = Get-ChildItem android/desktopApp/build/compose/jars/*.jar | Select-Object -First 1
          Copy-Item $jar.FullName "dist/Secount-$tag.jar"
          Copy-Item "android/desktopApp/build/compose/binaries/main/exe/Secount-1.1.0.exe" "dist/Secount-$tag-Windows.exe"
          Copy-Item "android/androidApp/build/outputs/apk/release/androidApp-release.apk" "dist/Secount-$tag-Android.apk"
          Get-ChildItem dist | ForEach-Object { if ($_.Length -lt 1024) { throw "Artifact looks invalid: $($_.Name)" } }
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release create $tag dist/* --verify-tag --generate-notes --title "Secount $tag"
