name: Release Secount

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Configure Android release signing
        shell: pwsh
        env:
          SECOUNT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SECOUNT_UPLOAD_KEYSTORE_BASE64 }}
          SECOUNT_UPLOAD_STORE_PASSWORD: ${{ secrets.SECOUNT_UPLOAD_STORE_PASSWORD }}
          SECOUNT_UPLOAD_KEY_ALIAS: ${{ secrets.SECOUNT_UPLOAD_KEY_ALIAS }}
          SECOUNT_UPLOAD_KEY_PASSWORD: ${{ secrets.SECOUNT_UPLOAD_KEY_PASSWORD }}
        run: |
          $required = @($env:SECOUNT_UPLOAD_KEYSTORE_BASE64, $env:SECOUNT_UPLOAD_STORE_PASSWORD, $env:SECOUNT_UPLOAD_KEY_ALIAS, $env:SECOUNT_UPLOAD_KEY_PASSWORD)
          if ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) }) { throw "Android signing secrets are incomplete; configure the SECOUNT_UPLOAD_* Actions secrets." }
          $keystore = Join-Path $env:RUNNER_TEMP "secount-upload.jks"
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:SECOUNT_UPLOAD_KEYSTORE_BASE64))
          "SECOUNT_UPLOAD_STORE_FILE=$keystore" >> $env:GITHUB_ENV
          "SECOUNT_UPLOAD_STORE_PASSWORD=$env:SECOUNT_UPLOAD_STORE_PASSWORD" >> $env:GITHUB_ENV
          "SECOUNT_UPLOAD_KEY_ALIAS=$env:SECOUNT_UPLOAD_KEY_ALIAS" >> $env:GITHUB_ENV
          "SECOUNT_UPLOAD_KEY_PASSWORD=$env:SECOUNT_UPLOAD_KEY_PASSWORD" >> $env:GITHUB_ENV
      - name: Test
        shell: pwsh
        run: gradle -p android :shared:desktopTest --no-daemon
      - name: Build release artifacts
        shell: pwsh
        run: |
          gradle -p android :desktopApp:packageUberJarForCurrentOS :desktopApp:packageExe :androidApp:assembleRelease --no-daemon
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $jar = Get-ChildItem android/desktopApp/build/compose/jars/*.jar | Select-Object -First 1
          Copy-Item $jar.FullName "dist/Secount-$tag.jar"
          $exe = Get-ChildItem "android/desktopApp/build/compose/binaries/main/exe/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows EXE was not produced" }
          Copy-Item $exe.FullName "dist/Secount-$tag-Windows.exe"
          if (-not (Test-Path "android/androidApp/build/outputs/apk/release/androidApp-release.apk")) { throw "Signed androidApp-release.apk not produced (only unsigned exists) — refusing to publish an unsigned production release. Configure the release keystore first (see docs/RELEASE.md)." }
          Copy-Item "android/androidApp/build/outputs/apk/release/androidApp-release.apk" "dist/Secount-$tag-Android.apk"
          Get-ChildItem dist | ForEach-Object { if ($_.Length -lt 1024) { throw "Artifact looks invalid: $($_.Name)" } }
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release create $tag dist/* --verify-tag --generate-notes --title "Secount $tag"
