name: Capture Secount home screen

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/runtime-screenshot.png"
      - "assets/runtime-locked.png"
      - "assets/runtime-unlocked.png"
      - "assets/demo.gif"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install capture tools
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick xdotool
      - name: Set up Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Build desktop app before launch
        run: gradle -p android :desktopApp:compileKotlin --no-daemon
      - name: Capture real Secount home screen
        shell: bash
        run: |
          set -e
          export DISPLAY=:99
          export HOME="$RUNNER_TEMP/secount-home"
          mkdir -p "$HOME"

          Xvfb :99 -screen 0 1200x900x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2

          # Start Secount normally. No forced lock preference is created:
          # this capture is the app's current home screen.
          gradle -p android :desktopApp:run --no-daemon > /tmp/secount.log 2>&1 &
          APP_PID=$!

          WID=""
          for i in $(seq 1 180); do
            WID=$(xdotool search --name "Secount" 2>/dev/null | head -n 1 || true)
            if [ -n "$WID" ]; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Secount process exited before window appeared"
              cat /tmp/secount.log || true
              exit 1
            fi
            sleep 1
          done
          if [ -z "$WID" ]; then
            echo "Secount window not found after 180 seconds"
            cat /tmp/secount.log || true
            exit 1
          fi

          sleep 5
          xdotool windowactivate --sync "$WID"
          sleep 2

          # Capture the actual normal home screen shown by the running app.
          import -window root assets/runtime-screenshot.png
          test -s assets/runtime-screenshot.png

          kill "$APP_PID" 2>/dev/null || true

      - name: Commit home-screen media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime-screenshot.png
          git rm --cached --ignore-unmatch assets/runtime-locked.png assets/runtime-unlocked.png assets/demo.gif || true
          rm -f assets/runtime-locked.png assets/runtime-unlocked.png assets/demo.gif
          if git diff --cached --quiet; then
            echo "No home-screen media changes."
          else
            git commit -m "Replace runtime lock media with Secount home screen"
            git push
          fi
