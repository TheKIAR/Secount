name: Capture Secount runtime preview

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/runtime-media.yml"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secount-runtime-preview
  cancel-in-progress: true

jobs:
  capture:
    name: Capture real desktop home screen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install capture tools
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick xdotool
      - name: Capture running application
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export HOME="$RUNNER_TEMP/secount-home"
          mkdir -p "$HOME"

          Xvfb :99 -screen 0 1200x900x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2

          gradle -p android :desktopApp:run --no-daemon > /tmp/secount.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; kill "$XVFB_PID" 2>/dev/null || true' EXIT

          WID=""
          for i in $(seq 1 180); do
            WID=$(xdotool search --onlyvisible --name "Secount" 2>/dev/null | head -n 1 || true)
            if [ -n "$WID" ]; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/secount.log || true
              exit 1
            fi
            sleep 1
          done

          test -n "$WID"
          sleep 5
          # `import` fails with "Resource temporarily unavailable" when the
          # window is not yet painted — retry instead of failing the run.
          ok=""
          for i in 1 2 3 4 5; do
            if import -window "$WID" assets/runtime-screenshot.png 2>/tmp/import-err.log && test -s assets/runtime-screenshot.png; then ok=1; break; fi
            cat /tmp/import-err.log || true
            sleep 3
          done
          test -n "$ok"
      - name: Upload runtime preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: secount-runtime-preview
          path: assets/runtime-screenshot.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit refreshed preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime-screenshot.png
          if git diff --cached --quiet; then
            echo "Runtime preview is unchanged."
          else
            git commit -m "Refresh Secount runtime preview"
            git push
          fi
