name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 2 1 * *"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: kotlin
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
