plugins {
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.compose"
}

dependencies {
    implementation(project(":shared"))
    implementation(compose.desktop.currentOs)
}

compose.desktop {
    application {
        mainClass = "com.secount.app.desktop.MainKt"
        nativeDistributions {
            packageName = "Secount"
            packageVersion = "1.1.2"
            vendor = "Md. Ragib Ashhab"
            description = "Secount — personal countdown and private-moment application"
            targetFormats(org.jetbrains.compose.desktop.application.dsl.TargetFormat.Exe)
            windows {
                iconFile.set(project.file("secount.ico"))
            }
        }
    }
}
